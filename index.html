<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RT.08 RW.04 - Laporan Kas Digital</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: #f4f7f5; /* Abu-abu terang dengan sedikit tint hijau segar */
            color: #1e293b; 
        }
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: #e2e8f0; }
        ::-webkit-scrollbar-thumb { background: #0f5132; border-radius: 3px; }
        ::-webkit-scrollbar-thumb:hover { background: #198754; }
    </style>
</head>
<body class="min-h-screen py-6 px-4 md:px-8 flex justify-center items-start">

    <div class="w-full max-w-4xl flex flex-col gap-5">
        
        <div class="bg-gradient-to-r from-[#0f5132] to-[#146c43] text-white text-center py-5 rounded-2xl shadow-md relative overflow-hidden border border-[#0f5132]/20">
            <div class="absolute -right-10 -top-10 w-24 h-24 bg-white/10 rounded-full blur-2xl"></div>
            <div class="absolute -left-10 -bottom-10 w-24 h-24 bg-emerald-400/20 rounded-full blur-2xl"></div>
            
            <h1 class="font-extrabold text-base md:text-lg tracking-wide uppercase text-white drop-shadow-sm">LAPORAN KAS RT.08 RW.04</h1>
            <p class="text-[10px] text-emerald-200 font-semibold uppercase tracking-widest mt-1 opacity-90">LAPORAN KAS RT.08 DIGITAL SYSTEM</p>
        </div>

        <div class="bg-white/80 backdrop-blur-md border border-slate-200/80 text-center py-6 rounded-2xl shadow-sm relative overflow-hidden">
            <div class="flex items-center justify-center gap-1.5 mb-2">
                <span class="flex h-2 w-2 relative">
                    <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-emerald-500 opacity-75"></span>
                    <span class="relative inline-flex rounded-full h-2 w-2 bg-emerald-500"></span>
                </span>
                <p class="text-[10px] text-emerald-600 font-bold tracking-widest uppercase">SYSTEM ONLINE</p>
            </div>
            <p class="text-xs text-slate-500 mb-1 font-medium tracking-wide">SALDO KAS RT.08 SAAT INI</p>
            <p id="total-saldo" class="text-3xl md:text-4xl font-extrabold tracking-tight text-[#0f5132]">Rp 0</p>
        </div>

        <div class="grid grid-cols-2 gap-3">
            <div class="bg-white/80 backdrop-blur-md border border-slate-200/80 p-4 rounded-2xl shadow-sm relative">
                <div class="absolute top-0 left-0 bottom-0 w-[4px] bg-emerald-600"></div>
                <p class="text-[9px] text-slate-500 font-bold uppercase tracking-wider mb-1">Total Pemasukan</p>
                <p id="total-pemasukan" class="text-base md:text-lg font-extrabold text-emerald-600">Rp 0</p>
            </div>
            <div class="bg-white/80 backdrop-blur-md border border-slate-200/80 p-4 rounded-2xl shadow-sm relative">
                <div class="absolute top-0 left-0 bottom-0 w-[4px] bg-rose-500"></div>
                <p class="text-[9px] text-slate-500 font-bold uppercase tracking-wider mb-1">Total Pengeluaran</p>
                <p id="total-pengeluaran" class="text-base md:text-lg font-extrabold text-rose-600">Rp 0</p>
            </div>
        </div>

        <button onclick="checkAccess('add')" class="w-full bg-[#0f5132] hover:bg-[#146c43] text-white font-bold py-3.5 rounded-xl transition duration-200 flex items-center justify-center gap-2 shadow-sm shadow-emerald-900/10 tracking-wide text-sm">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 text-emerald-300" viewBox="0 0 20 20" fill="currentColor">
                <path fill-rule="evenodd" d="M10 3a1 1 0 011 1v5h5a1 1 0 110 2h-5v5a1 1 0 11-2 0v-5H4a1 1 0 110-2h5V4a1 1 0 011-1z" clip-rule="evenodd" />
            </svg>
            Tambah Transaksi Baru
        </button>

        <div class="bg-white border border-slate-200 rounded-3xl p-4 md:p-6 shadow-sm">
            <div class="flex justify-between items-center mb-5">
                <h2 class="text-slate-800 font-extrabold text-sm md:text-base tracking-wide uppercase border-b-2 border-[#0f5132] pb-1">LAPORAN MUTASI KAS RT 08</h2>
                <span id="loading-status" class="text-[10px] text-emerald-700 bg-emerald-50 px-2.5 py-1 rounded-full font-bold border border-emerald-200">Sinkron...</span>
            </div>
            
            <div class="grid grid-cols-12 text-[10px] md:text-xs font-black text-slate-700 uppercase border-b border-slate-200 pb-2 mb-3 tracking-wider bg-slate-50 p-1 rounded-md">
                <div class="col-span-4 md:col-span-5">Keterangan / Tanggal</div>
                <div class="col-span-2 text-right">Masuk</div>
                <div class="col-span-2 text-right">Keluar</div>
                <div class="col-span-2 md:col-span-2 text-right">Saldo</div>
                <div class="col-span-2 md:col-span-1 text-center">Aksi</div>
            </div>

            <div id="mutasi-list" class="flex flex-col gap-1 text-xs md:text-sm font-bold"></div>
        </div>

        <div class="text-center py-2 mt-2">
            <p class="text-[10px] font-bold tracking-widest text-slate-400 uppercase">POWERED BY : MBS ID</p>
        </div>

    </div>

    <div id="transaction-modal" class="hidden fixed inset-0 bg-slate-900/40 backdrop-blur-sm flex items-center justify-center p-4 z-50">
        <div class="bg-white border border-slate-200 rounded-2xl w-full max-w-md p-6 shadow-xl relative text-slate-800">
            <h3 id="modal-title" class="text-[#0f5132] font-extrabold text-base uppercase mb-4">Tambah Transaksi</h3>
            
            <form id="transaction-form" onsubmit="handleFormSubmit(event)">
                <input type="hidden" id="form-id">
                
                <div class="flex flex-col gap-4">
                    <div>
                        <label class="text-[10px] font-bold text-slate-500 uppercase block mb-1">Tanggal / Periode</label>
                        <input type="text" id="form-tanggal" placeholder="Contoh: 17/05/2026 atau 2026" class="w-full bg-slate-50 border border-slate-300 rounded-lg p-2.5 text-xs text-slate-800 font-bold focus:outline-none focus:border-[#0f5132]" required>
                    </div>
                    <div>
                        <label class="text-[10px] font-bold text-slate-500 uppercase block mb-1">Keterangan Transaksi</label>
                        <input type="text" id="form-keterangan" placeholder="Contoh: IURAN WARGA / BELI ATK" class="w-full bg-slate-50 border border-slate-300 rounded-lg p-2.5 text-xs text-slate-800 font-bold focus:outline-none focus:border-[#0f5132]" required>
                    </div>
                    <div class="grid grid-cols-2 gap-3">
                        <div>
                            <label class="text-[10px] font-bold text-slate-500 uppercase block mb-1">Nominal Masuk (Rp)</label>
                            <input type="number" id="form-masuk" value="0" class="w-full bg-slate-50 border border-slate-300 rounded-lg p-2.5 text-xs text-slate-800 font-bold focus:outline-none focus:border-[#0f5132]" required>
                        </div>
                        <div>
                            <label class="text-[10px] font-bold text-slate-500 uppercase block mb-1">Nominal Keluar (Rp)</label>
                            <input type="number" id="form-keluar" value="0" class="w-full bg-slate-50 border border-slate-300 rounded-lg p-2.5 text-xs text-slate-800 font-bold focus:outline-none focus:border-[#0f5132]" required>
                        </div>
                    </div>
                    <div>
                        <label class="text-[10px] font-bold text-slate-500 uppercase block mb-1">Link URL Foto Nota (Opsional)</label>
                        <input type="url" id="form-nota" placeholder="https://drive.google.com/..." class="w-full bg-slate-50 border border-slate-300 rounded-lg p-2.5 text-xs text-slate-800 font-bold focus:outline-none focus:border-[#0f5132]">
                    </div>
                </div>

                <div class="flex justify-end gap-2.5 mt-6">
                    <button type="button" onclick="closeModal()" class="bg-slate-100 hover:bg-slate-200 text-slate-600 font-bold px-4 py-2 rounded-xl text-xs">Batal</button>
                    <button type="submit" class="bg-[#0f5132] hover:bg-[#146c43] text-white font-bold px-4 py-2 rounded-xl text-xs">Simpan Data</button>
                </div>
            </form>
        </div>
    </div>

    <script>
        // URL WEB APP ANDA YANG BARU SUDAH BERHASIL TERPASANG DI BAWAH INI
        const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbxEVJmHYhLlGSKqy8u5t6HusWdLMI-PJoidvoaEaWsB9f5GUrRvP47OyVIqSA3SfQSz/exec";
        const SECURITY_PIN = "999";
        let currentDatabase = [];

        function formatRupiah(angka) {
            return "Rp " + new Intl.NumberFormat('id-ID').format(angka);
        }

        function saveToLocalStorage() {
            localStorage.setItem("KAS_RT08_DATABASE", JSON.stringify(currentDatabase));
        }

        function loadFromLocalStorage() {
            const localData = localStorage.getItem("KAS_RT08_DATABASE");
            if (localData) {
                currentDatabase = JSON.parse(localData);
            } else {
                currentDatabase = [
                    { tanggal: "2026", keterangan: "SALDO KAS AWAL", masuk: 1000000, keluar: 0, nota: "" }
                ];
                saveToLocalStorage();
            }
        }

        function checkAccess(mode, index = null) {
            const inputPin = prompt("Masukkan PIN Pengurus untuk melanjutkan:");
            if (inputPin === null) return;
            
            if (inputPin === SECURITY_PIN) {
                if (mode === 'add' || mode === 'edit') {
                    openModal(mode, index);
                } else if (mode === 'delete') {
                    executeDelete(index);
                }
            } else {
                alert("⚠️ PIN Salah! Akses ditolak.");
            }
        }

        function openModal(mode, index = null) {
            const modal = document.getElementById("transaction-modal");
            const title = document.getElementById("modal-title");
            const form = document.getElementById("transaction-form");
            
            form.reset();
            modal.classList.remove("hidden");

            if (mode === 'add') {
                title.innerText = "Tambah Transaksi";
                document.getElementById("form-id").value = "";
                document.getElementById("form-masuk").value = "0";
                document.getElementById("form-keluar").value = "0";
            } else if (mode === 'edit' && index !== null) {
                title.innerText = "Edit Transaksi";
                const item = currentDatabase[index];
                document.getElementById("form-id").value = index;
                document.getElementById("form-tanggal").value = item.tanggal;
                document.getElementById("form-keterangan").value = item.keterangan;
                document.getElementById("form-masuk").value = item.masuk;
                document.getElementById("form-keluar").value = item.keluar;
                document.getElementById("form-nota").value = item.nota || "";
            }
        }

        function closeModal() {
            document.getElementById("transaction-modal").classList.add("hidden");
        }

        function renderData(rows) {
            const container = document.getElementById("mutasi-list");
            container.innerHTML = "";
            
            let runningSaldo = 0;
            let totalMasuk = 0;
            let totalKeluar = 0;

            rows.forEach((item, index) => {
                const masuk = parseInt(item.masuk) || 0;
                const keluar = parseInt(item.keluar) || 0;
                
                totalMasuk += masuk;
                totalKeluar += keluar;
                runningSaldo += (masuk - keluar);

                const rowDiv = document.createElement("div");
                rowDiv.className = `grid grid-cols-12 items-center py-2.5 border-b border-slate-100 hover:bg-emerald-50/40 px-1 rounded-lg transition font-extrabold ${index % 2 === 0 ? 'bg-white' : 'bg-slate-50/60'}`;

                let notaHtml = "";
                if (item.nota && item.nota.trim() !== "") {
                    notaHtml = `<br><a href="${item.nota}" target="_blank" class="text-[10px] text-emerald-600 font-black hover:underline inline-block mt-0.5 tracking-wide">Lihat Foto Nota</a>`;
                }

                const colKet = document.createElement("div");
                colKet.className = "col-span-4 lg:col-span-5 pr-1 break-words";
                colKet.innerHTML = `<span class="text-slate-400 font-bold text-[10px] md:text-xs">/${item.tanggal}</span> <span class="text-slate-800 uppercase block md:inline md:ml-1">${item.keterangan}</span>${notaHtml}`;
                
                const colMasuk = document.createElement("div");
                colMasuk.className = "col-span-2 text-right text-emerald-600";
                colMasuk.innerText = masuk > 0 ? formatRupiah(masuk).replace("Rp ", "") : "-";

                const colKeluar = document.createElement("div");
                colKeluar.className = "col-span-2 text-right text-rose-600";
                colKeluar.innerText = keluar > 0 ? formatRupiah(keluar).replace("Rp ", "") : "-";

                const colSaldo = document.createElement("div");
                colSaldo.className = "col-span-2 md:col-span-2 text-right text-slate-800";
                colSaldo.innerText = formatRupiah(runningSaldo).replace("Rp ", "");

                const colAksi = document.createElement("div");
                colAksi.className = "col-span-2 lg:col-span-1 flex justify-center gap-2 pl-1";
                colAksi.innerHTML = `
                    <button onclick="checkAccess('edit', ${index})" class="text-amber-600 hover:text-amber-500 transition p-1" title="Edit">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5"><path stroke-linecap="round" stroke-linejoin="round" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z" /></svg>
                    </button>
                    <button onclick="checkAccess('delete', ${index})" class="text-rose-600 hover:text-rose-500 transition p-1" title="Hapus">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5"><path stroke-linecap="round" stroke-linejoin="round" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" /></svg>
                    </button>
                `;

                rowDiv.appendChild(colKet);
                rowDiv.appendChild(colMasuk);
                rowDiv.appendChild(colKeluar);
                rowDiv.appendChild(colSaldo);
                rowDiv.appendChild(colAksi);
                container.appendChild(rowDiv);
            });

            document.getElementById("total-saldo").innerText = formatRupiah(runningSaldo);
            document.getElementById("total-pemasukan").innerText = formatRupiah(totalMasuk);
            document.getElementById("total-pengeluaran").innerText = formatRupiah(totalKeluar);
        }

        async function fetchLiveKasData() {
            const statusBadge = document.getElementById("loading-status");
            statusBadge.innerText = "Sinkronisasi...";
            statusBadge.className = "text-[10px] text-amber-600 bg-amber-50 px-2 py-0.5 rounded-full animate-pulse border border-amber-200 font-bold";
            
            if (!WEB_APP_URL || WEB_APP_URL.includes("ISI_DENGAN_URL")) {
                renderData(currentDatabase);
                statusBadge.innerText = "Lokal Terproteksi";
                statusBadge.className = "text-[10px] text-slate-500 bg-slate-100 px-2 py-0.5 rounded-full border border-slate-200 font-bold";
                return;
            }

            try {
                const antiCacheUrl = `${WEB_APP_URL}?_cb=${new Date().getTime()}`;
                const response = await fetch(antiCacheUrl);
                const data = await response.json();
                
                currentDatabase = data;
                saveToLocalStorage();
                renderData(currentDatabase);
                
                statusBadge.innerText = "Terupdate";
                statusBadge.className = "text-[10px] text-emerald-700 bg-emerald-50 px-2 py-0.5 rounded-full border border-emerald-200 font-bold";
            } catch (error) {
                console.error("Gagal sinkronisasi cloud, memuat cadangan lokal.");
                renderData(currentDatabase);
                statusBadge.innerText = "Offline (Lokal)";
                statusBadge.className = "text-[10px] text-rose-600 bg-rose-50 px-2 py-0.5 rounded-full border border-rose-200 font-bold";
            }
        }

        async function handleFormSubmit(e) {
            e.preventDefault();
            const id = document.getElementById("form-id").value;
            const payload = {
                action: id === "" ? "CREATE" : "UPDATE",
                rowIndex: id !== "" ? parseInt(id) : null,
                tanggal: document.getElementById("form-tanggal").value,
                keterangan: document.getElementById("form-keterangan").value,
                masuk: parseInt(document.getElementById("form-masuk").value) || 0,
                keluar: parseInt(document.getElementById("form-keluar").value) || 0,
                nota: document.getElementById("form-nota").value
            };

            closeModal();
            const statusBadge = document.getElementById("loading-status");
            statusBadge.innerText = "Menyimpan...";
            
            if(payload.action === "CREATE") {
                currentDatabase.push({
                    tanggal: payload.tanggal, keterangan: payload.keterangan,
                    masuk: payload.masuk, keluar: payload.keluar, nota: payload.nota
                });
            } else {
                currentDatabase[payload.rowIndex] = {
                    tanggal: payload.tanggal, keterangan: payload.keterangan,
                    masuk: payload.masuk, keluar: payload.keluar, nota: payload.nota
                };
            }
            
            saveToLocalStorage();
            renderData(currentDatabase); 

            if (!WEB_APP_URL || WEB_APP_URL.includes("ISI_DENGAN_URL")) {
                statusBadge.innerText = "Terupdate";
                return;
            }

            try {
                await fetch(WEB_APP_URL, {
                    method: "POST",
                    headers: { "Content-Type": "text/plain" },
                    body: JSON.stringify(payload)
                });
                setTimeout(fetchLiveKasData, 800);
            } catch (error) {
                setTimeout(fetchLiveKasData, 1000);
            }
        }

        async function executeDelete(index) {
            if (!confirm(`Hapus transaksi: "${currentDatabase[index].keterangan}"?`)) return;
            
            const statusBadge = document.getElementById("loading-status");
            statusBadge.innerText = "Menghapus...";

            currentDatabase.splice(index, 1);
            saveToLocalStorage();
            renderData(currentDatabase);

            if (!WEB_APP_URL || WEB_APP_URL.includes("ISI_DENGAN_URL")) {
                statusBadge.innerText = "Terupdate";
                return;
            }

            try {
                await fetch(WEB_APP_URL, {
                    method: "POST",
                    headers: { "Content-Type": "text/plain" },
                    body: JSON.stringify({ action: "DELETE", rowIndex: index })
                });
                setTimeout(fetchLiveKasData, 800);
            } catch (error) {
                setTimeout(fetchLiveKasData, 1000);
            }
        }

        window.addEventListener("DOMContentLoaded", () => {
            loadFromLocalStorage();
            fetchLiveKasData();
        });
    </script>
</body>
</html>
