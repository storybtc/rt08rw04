<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Musholla Wakaf An-Nur - Laporan Infaq Digital</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: #0d1117;
            color: #c9d1d9;
        }
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: #161b22; }
        ::-webkit-scrollbar-thumb { background: #21262d; border-radius: 3px; }
        ::-webkit-scrollbar-thumb:hover { background: #00FF66; }
    </style>
</head>
<body class="min-h-screen py-6 px-4 flex justify-center items-start">

    <div class="w-full max-w-xl flex flex-col gap-4">
        
        <div class="bg-[#072517] border border-[#00FF66]/20 text-white text-center py-4 rounded-2xl shadow-lg relative overflow-hidden">
            <div class="absolute -right-6 -top-6 w-16 h-16 bg-[#00FF66]/10 rounded-full blur-xl"></div>
            <h1 class="font-extrabold text-base tracking-wide uppercase text-[#00FF66]">MUSHOLLA WAKAF AN-NUR</h1>
            <p class="text-[10px] text-emerald-400 font-medium uppercase tracking-widest mt-0.5">LAPORAN INFAQ DIGITAL SYSTEM</p>
        </div>

        <div class="bg-gradient-to-br from-[#111827] to-[#1f2937] border border-gray-800 text-white text-center py-6 rounded-2xl shadow-xl relative overflow-hidden">
            <div class="absolute top-0 left-0 right-0 h-[2px] bg-gradient-to-r from-emerald-500 via-[#00FF66] to-cyan-500"></div>
            
            <div class="flex items-center justify-center gap-1.5 mb-2">
                <span class="flex h-2 w-2 relative">
                    <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-[#00FF66] opacity-75"></span>
                    <span class="relative inline-flex rounded-full h-2 w-2 bg-[#00FF66]"></span>
                </span>
                <p class="text-[10px] text-[#00FF66] font-bold tracking-widest uppercase">SYSTEM ONLINE</p>
            </div>
            
            <p class="text-xs text-gray-400 mb-1 font-medium tracking-wide">SALDO INFAQ SAAT INI</p>
            <p id="total-saldo" class="text-3xl font-extrabold tracking-tight text-white">Rp 0</p>
        </div>

        <div class="grid grid-cols-2 gap-3">
            <div class="bg-[#161b22] border border-emerald-950 p-4 rounded-2xl shadow-md relative">
                <div class="absolute top-0 left-0 bottom-0 w-[4px] bg-[#00FF66]"></div>
                <p class="text-[9px] text-gray-400 font-bold uppercase tracking-wider mb-1">Total Pemasukan</p>
                <p id="total-pemasukan" class="text-lg font-extrabold text-[#00FF66]">Rp 0</p>
            </div>
            <div class="bg-[#161b22] border border-red-950 p-4 rounded-2xl shadow-md relative">
                <div class="absolute top-0 left-0 bottom-0 w-[4px] bg-red-500"></div>
                <p class="text-[9px] text-gray-400 font-bold uppercase tracking-wider mb-1">Total Pengeluaran</p>
                <p id="total-pengeluaran" class="text-lg font-extrabold text-red-400">Rp 0</p>
            </div>
        </div>

        <button onclick="checkAccess('add')" class="w-full bg-[#00FF66] hover:bg-emerald-400 text-black font-bold py-3 rounded-xl transition duration-200 flex items-center justify-center gap-2 shadow-lg shadow-[#00FF66]/10">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 20 20" fill="currentColor">
                <path fill-rule="evenodd" d="M10 3a1 1 0 011 1v5h5a1 1 0 110 2h-5v5a1 1 0 11-2 0v-5H4a1 1 0 110-2h5V4a1 1 0 011-1z" clip-rule="evenodd" />
            </svg>
            Tambah Transaksi Baru
        </button>

        <div class="bg-[#161b22] border border-gray-800 rounded-3xl p-5 shadow-lg">
            <div class="flex justify-between items-center mb-4">
                <h2 class="text-white font-extrabold text-sm tracking-wide uppercase border-b-2 border-[#00FF66] pb-1">Laporan Mutasi Infaq</h2>
                <span id="loading-status" class="text-[10px] text-gray-500 bg-gray-800 px-2 py-0.5 rounded-full">Memuat data...</span>
            </div>
            
            <div class="grid grid-cols-12 text-[10px] font-bold text-gray-400 uppercase border-b border-gray-800 pb-2 mb-3 tracking-wider">
                <div class="col-span-4">Keterangan</div>
                <div class="col-span-2 text-right">Masuk</div>
                <div class="col-span-2 text-right">Keluar</div>
                <div class="col-span-2 text-right">Saldo</div>
                <div class="col-span-2 text-center">Aksi</div>
            </div>

            <div id="mutasi-list" class="flex flex-col gap-3.5 text-xs"></div>
        </div>
    </div>

    <div id="transaction-modal" class="hidden fixed inset-0 bg-black/80 backdrop-blur-sm flex items-center justify-center p-4 z-50">
        <div class="bg-[#161b22] border border-gray-800 rounded-2xl w-full max-w-md p-6 shadow-2xl relative">
            <h3 id="modal-title" class="text-white font-extrabold text-base uppercase mb-4 text-[#00FF66]">Tambah Transaksi</h3>
            
            <form id="transaction-form" onsubmit="handleFormSubmit(event)">
                <input type="hidden" id="form-id">
                
                <div class="flex flex-col gap-4">
                    <div>
                        <label class="text-[10px] font-bold text-gray-400 uppercase block mb-1">Tanggal / Periode</label>
                        <input type="text" id="form-tanggal" placeholder="Contoh: 2026 atau 3/2026" class="w-full bg-[#0d1117] border border-gray-800 rounded-lg p-2.5 text-xs text-white focus:outline-none focus:border-[#00FF66]" required>
                    </div>
                    <div>
                        <label class="text-[10px] font-bold text-gray-400 uppercase block mb-1">Keterangan Transaksi</label>
                        <input type="text" id="form-keterangan" placeholder="Contoh: HAMBA ALLAH / BELI SEMEN" class="w-full bg-[#0d1117] border border-gray-800 rounded-lg p-2.5 text-xs text-white focus:outline-none focus:border-[#00FF66]" required>
                    </div>
                    <div class="grid grid-cols-2 gap-3">
                        <div>
                            <label class="text-[10px] font-bold text-gray-400 uppercase block mb-1">Nominal Masuk (Rp)</label>
                            <input type="number" id="form-masuk" value="0" class="w-full bg-[#0d1117] border border-gray-800 rounded-lg p-2.5 text-xs text-white focus:outline-none focus:border-[#00FF66]" required>
                        </div>
                        <div>
                            <label class="text-[10px] font-bold text-gray-400 uppercase block mb-1">Nominal Keluar (Rp)</label>
                            <input type="number" id="form-keluar" value="0" class="w-full bg-[#0d1117] border border-gray-800 rounded-lg p-2.5 text-xs text-white focus:outline-none focus:border-[#00FF66]" required>
                        </div>
                    </div>
                    <div>
                        <label class="text-[10px] font-bold text-gray-400 uppercase block mb-1">Link URL Foto Nota (Opsional)</label>
                        <input type="url" id="form-nota" placeholder="https://drive.google.com/... / https://link-nota.com" class="w-full bg-[#0d1117] border border-gray-800 rounded-lg p-2.5 text-xs text-white focus:outline-none focus:border-[#00FF66]">
                    </div>
                </div>

                <div class="flex justify-end gap-2.5 mt-6">
                    <button type="button" onclick="closeModal()" class="bg-gray-800 hover:bg-gray-700 text-gray-300 font-semibold px-4 py-2 rounded-xl text-xs transition">Batal</button>
                    <button type="submit" class="bg-[#00FF66] hover:bg-emerald-400 text-black font-bold px-4 py-2 rounded-xl text-xs transition">Simpan Data</button>
                </div>
            </form>
        </div>
    </div>

    <script>
        // =========================================================================
        // PENTING: PASTI KAN UNTUK MENGGANTI URL DI BAWAH INI DENGAN WEB APP URL ANDA!
        // =========================================================================
        const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbzXXXXXXXXXXXXX/exec";
        
        const SECURITY_PIN = "999";
        let currentDatabase = [];

        function formatRupiah(angka) {
            return "Rp " + new Intl.NumberFormat('id-ID').format(angka);
        }

        function checkAccess(mode, index = null) {
            const inputPin = prompt("Masukkan PIN Pengurus untuk melanjutkan:");
            if (inputPin === null) return;
            
            if (inputPin === SECURITY_PIN) {
                if (mode === 'add' || mode === 'edit') {
                    openModal(mode, index);
                } else if (mode === 'delete') {
                    executeDelete(index);
                }
            } else {
                alert("⚠️ PIN Salah! Akses ditolak.");
            }
        }

        function openModal(mode, index = null) {
            const modal = document.getElementById("transaction-modal");
            const title = document.getElementById("modal-title");
            const form = document.getElementById("transaction-form");
            
            form.reset();
            modal.classList.remove("hidden");

            if (mode === 'add') {
                title.innerText = "Tambah Transaksi";
                document.getElementById("form-id").value = "";
                document.getElementById("form-masuk").value = "0";
                document.getElementById("form-keluar").value = "0";
            } else if (mode === 'edit' && index !== null) {
                title.innerText = "Edit Transaksi";
                const item = currentDatabase[index];
                document.getElementById("form-id").value = index;
                document.getElementById("form-tanggal").value = item.tanggal;
                document.getElementById("form-keterangan").value = item.keterangan;
                document.getElementById("form-masuk").value = item.masuk;
                document.getElementById("form-keluar").value = item.keluar;
                document.getElementById("form-nota").value = item.nota || "";
            }
        }

        function closeModal() {
            document.getElementById("transaction-modal").classList.add("hidden");
        }

        function renderData(rows) {
            currentDatabase = rows;
            const container = document.getElementById("mutasi-list");
            container.innerHTML = "";
            
            let runningSaldo = 0;
            let totalMasuk = 0;
            let totalKeluar = 0;

            rows.forEach((item, index) => {
                const masuk = parseInt(item.masuk) || 0;
                const keluar = parseInt(item.keluar) || 0;
                
                totalMasuk += masuk;
                totalKeluar += keluar;
                runningSaldo += (masuk - keluar);

                const rowDiv = document.createElement("div");
                rowDiv.className = "grid grid-cols-12 items-center py-2 border-b border-gray-900/40 hover:bg-gray-800/20 px-1 rounded-lg transition";

                let notaHtml = "";
                if (item.nota && item.nota.trim() !== "") {
                    notaHtml = `<br><a href="${item.nota}" target="_blank" class="text-[10px] text-cyan-400 hover:text-[#00FF66] underline">Lihat Foto Nota</a>`;
                }

                const colKet = document.createElement("div");
                colKet.className = "col-span-4 pr-1 break-words";
                colKet.innerHTML = `<span class="text-gray-500 font-normal">/${item.tanggal}</span> <span class="font-semibold text-gray-300 uppercase">${item.keterangan}</span>${notaHtml}`;
                
                const colMasuk = document.createElement("div");
                colMasuk.className = "col-span-2 text-right font-medium text-[#00FF66]";
                colMasuk.innerText = masuk > 0 ? formatRupiah(masuk).replace("Rp ", "") : "-";

                const colKeluar = document.createElement("div");
                colKeluar.className = "col-span-2 text-right font-medium text-red-400";
                colKeluar.innerText = keluar > 0 ? formatRupiah(keluar).replace("Rp ", "") : "-";

                const colSaldo = document.createElement("div");
                colSaldo.className = "col-span-2 text-right font-semibold text-blue-400";
                colSaldo.innerText = formatRupiah(runningSaldo).replace("Rp ", "");

                const colAksi = document.createElement("div");
                colAksi.className = "col-span-2 flex justify-center gap-2 pl-1";
                colAksi.innerHTML = `
                    <button onclick="checkAccess('edit', ${index})" class="text-amber-400 hover:text-amber-300 transition" title="Edit">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z" /></svg>
                    </button>
                    <button onclick="checkAccess('delete', ${index})" class="text-red-500 hover:text-red-400 transition" title="Hapus">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" /></svg>
                    </button>
                `;

                rowDiv.appendChild(colKet);
                rowDiv.appendChild(colMasuk);
                rowDiv.appendChild(colKeluar);
                rowDiv.appendChild(colSaldo);
                rowDiv.appendChild(colAksi);
                container.appendChild(rowDiv);
            });

            document.getElementById("total-saldo").innerText = formatRupiah(runningSaldo);
            document.getElementById("total-pemasukan").innerText = formatRupiah(totalMasuk);
            document.getElementById("total-pengeluaran").innerText = formatRupiah(totalKeluar);
        }

        // AMBIL DATA DENGAN ANTI-CACHE SUPAYA RIWAYAT SELALU LIVE BERUBAH
        async function fetchLiveInfaqData() {
            const statusBadge = document.getElementById("loading-status");
            statusBadge.innerText = "Sinkronisasi...";
            statusBadge.className = "text-[10px] text-amber-400 bg-amber-950 px-2 py-0.5 rounded-full animate-pulse";
            
            try {
                if (WEB_APP_URL.includes("XXXXXXXXXXXXX")) {
                    renderData([
                        { tanggal: "2025", keterangan: "SALDO INFAQ AWAL", masuk: 1000000, keluar: 0, nota: "" },
                        { tanggal: "2026", keterangan: "HAMBA ALLAH", masuk: 150000, keluar: 0, nota: "" }
                    ]);
                    statusBadge.innerText = "Mode Demo";
                    return;
                }

                const antiCacheUrl = `${WEB_APP_URL}?_cb=${new Date().getTime()}`;
                const response = await fetch(antiCacheUrl);
                const data = await response.json();
                renderData(data);
                
                statusBadge.innerText = "Live Terupdate";
                statusBadge.className = "text-[10px] text-[#00FF66] bg-emerald-950 px-2 py-0.5 rounded-full border border-[#00FF66]/20";
            } catch (error) {
                console.error(error);
                statusBadge.innerText = "Offline Mode";
                statusBadge.className = "text-[10px] text-red-400 bg-red-950 px-2 py-0.5 rounded-full";
            }
        }

        // KIRIM INPUT DATA BARU & EDIT LANGSUNG KONEK
        async function handleFormSubmit(e) {
            e.preventDefault();
            const id = document.getElementById("form-id").value;
            const payload = {
                action: id === "" ? "CREATE" : "UPDATE",
                rowIndex: id !== "" ? parseInt(id) : null,
                tanggal: document.getElementById("form-tanggal").value,
                keterangan: document.getElementById("form-keterangan").value,
                masuk: parseInt(document.getElementById("form-masuk").value) || 0,
                keluar: parseInt(document.getElementById("form-keluar").value) || 0,
                nota: document.getElementById("form-nota").value
            };

            closeModal();
            const statusBadge = document.getElementById("loading-status");
            statusBadge.innerText = "Menyimpan...";
            
            // Perubahan Instan di UI Lokal (Riwayat Langsung Berubah Tanpa Menunggu Server)
            if(payload.action === "CREATE") {
                currentDatabase.push({
                    tanggal: payload.tanggal, keterangan: payload.keterangan,
                    masuk: payload.masuk, keluar: payload.keluar, nota: payload.nota
                });
            } else {
                currentDatabase[payload.rowIndex] = {
                    tanggal: payload.tanggal, keterangan: payload.keterangan,
                    masuk: payload.masuk, keluar: payload.keluar, nota: payload.nota
                };
            }
            renderData(currentDatabase); 

            try {
                // Kirim Eksekusi ke Google Sheet Cloud
                await fetch(WEB_APP_URL, {
                    method: "POST",
                    headers: { "Content-Type": "text/plain" }, // Menggunakan text/plain bypass CORS pre-flight
                    body: JSON.stringify(payload)
                });
                
                // Ambil ulang database dari cloud dalam 1 detik untuk validasi akhir
                setTimeout(fetchLiveInfaqData, 1000);
            } catch (error) {
                console.log("Koneksi cloud latar belakang diproses.");
                setTimeout(fetchLiveInfaqData, 1200);
            }
        }

        // HAPUS DATA LANGSUNG KONEK
        async function executeDelete(index) {
            if (!confirm(`Hapus transaksi: "${currentDatabase[index].keterangan}"?`)) return;
            
            const statusBadge = document.getElementById("loading-status");
            statusBadge.innerText = "Menghapus...";

            // Langsung hilangkan dari layar riwayat (Instant Update)
            currentDatabase.splice(index, 1);
            renderData(currentDatabase);

            try {
                await fetch(WEB_APP_URL, {
                    method: "POST",
                    headers: { "Content-Type": "text/plain" },
                    body: JSON.stringify({ action: "DELETE", rowIndex: index })
                });
                setTimeout(fetchLiveInfaqData, 1000);
            } catch (error) {
                setTimeout(fetchLiveInfaqData, 1200);
            }
        }

        window.addEventListener("DOMContentLoaded", fetchLiveInfaqData);
    </script>
</body>
</html>
